<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAUHAUS — Color Wheel Instrument</title>
  <style>
    :root {
      --paper: #f3efe6;
      --surface: #faf8f2;
      --white: #ffffff;
      --ink: #141413;
      --muted: #5a564e;
      --rule: #d5cfc1;
      --red: #d92b24;
      --blue: #1448b8;
      --yellow: #f2be1a;
      --border: 3px;
      --shadow: 5px 5px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
      --font-sans: "Futura", "Avenir Next", "Montserrat", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", "Menlo", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, rgba(20, 20, 19, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(20, 20, 19, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      padding: clamp(14px, 2.5vw, 28px);
      -webkit-font-smoothing: antialiased;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    /* ── Masthead ──────────────────────────────────────────────── */
    .masthead {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: stretch;
      border: var(--border) solid var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .bauhaus-mark {
      display: grid;
      grid-template-columns: repeat(3, 28px);
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      background: var(--ink);
      border-right: var(--border) solid var(--ink);
    }

    .shape-tri {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid var(--yellow);
    }

    .shape-sq {
      width: 24px;
      height: 24px;
      background: var(--red);
      margin: 0 auto;
    }

    .shape-cir {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--blue);
      margin: 0 auto;
    }

    .masthead-title {
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.6vw, 2.35rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .masthead-meta {
      display: grid;
      grid-template-rows: 1fr 1fr;
      border-left: var(--border) solid var(--ink);
      min-width: 156px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta-cell {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .meta-cell:first-child {
      background: var(--yellow);
      border-bottom: var(--border) solid var(--ink);
    }

    .meta-cell:last-child {
      background: var(--white);
      color: var(--muted);
    }

    /* ── Main Workspace ────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.38fr) minmax(320px, 0.82fr);
      gap: 20px;
      align-items: stretch;
    }

    .card {
      border: var(--border) solid var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: var(--border) solid var(--ink);
      background: var(--white);
    }

    .card-title {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .plate-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 5px;
      background: var(--ink);
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .card-hint {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Plate 01: Wheel & Grayscale Stage ─────────────────────── */
    .wheel-section {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .wheel-body {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: stretch;
      min-height: clamp(460px, 50vw, 600px);
    }

    .grayscale-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 22px 20px 18px;
      border-right: 1px solid var(--rule);
      background: var(--surface);
    }

    .rail-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      user-select: none;
    }

    .grayscale-bar {
      position: relative;
      width: 20px;
      height: 300px;
      display: grid;
      grid-template-rows: repeat(10, minmax(0, 1fr));
      gap: 2px;
      padding: 0;
      border: 0;
      background: var(--surface);
    }

    .grayscale-bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(100% + 5px);
      width: 1px;
      background: rgba(20, 20, 19, 0.22);
      pointer-events: none;
    }

    .gray-chip {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      box-shadow: inset 0 0 0 0.5px rgba(20, 20, 19, 0.08);
      appearance: none;
      cursor: pointer;
      position: relative;
      transition: box-shadow 90ms ease;
    }

    .gray-chip::before {
      content: "";
      position: absolute;
      left: calc(100% + 5px);
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 1px;
      background: rgba(20, 20, 19, 0.35);
      pointer-events: none;
    }

    .gray-chip:first-child::before,
    .gray-chip:last-child::before {
      width: 7px;
      background: rgba(20, 20, 19, 0.78);
    }

    .gray-chip:hover {
      box-shadow: 0 0 0 1px var(--ink), inset 0 0 0 0.5px var(--ink);
      z-index: 2;
    }

    .gray-chip.is-selected {
      box-shadow: 0 0 0 1.5px var(--ink), inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      z-index: 3;
    }

    .gray-chip.is-selected::before {
      left: calc(100% + 3px);
      width: 0;
      height: 0;
      background: transparent;
      border-top: 4.5px solid transparent;
      border-bottom: 4.5px solid transparent;
      border-right: 7px solid var(--red);
    }

    .gray-chip[data-tip]:hover::after,
    .gray-chip[data-tip]:focus-visible::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 16px);
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 7px;
      background: var(--ink);
      color: var(--white);
      border: 2px solid var(--white);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      z-index: 30;
    }

    .wheel-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-width: 0;
      min-height: 0;
    }

    .wheel-wrap {
      width: var(--wheel-size, 420px);
      height: var(--wheel-size, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #wheel {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
      border-radius: 50%;
    }

    #wheel:focus {
      outline: none;
    }

    #wheel.is-keyboard-focus {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    /* ── Plate 02: Color Specimen & Inspector ──────────────────── */
    .info-panel {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .info-body {
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      align-content: start;
    }

    .preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: var(--border) solid var(--ink);
      background: #ff0000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
      transition: background-color 120ms ease;
    }

    .preview-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 2px solid currentColor;
    }

    .preview-hex-big {
      font-family: var(--font-mono);
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .hex-lookup {
      display: grid;
      grid-template-columns: 1fr auto;
      border: var(--border) solid var(--ink);
      background: var(--white);
    }

    .hex-lookup input {
      width: 100%;
      min-width: 0;
      border: 0;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: transparent;
      outline: none;
    }

    .hex-lookup input:focus {
      background: #fffdf5;
    }

    .hex-lookup button {
      border: 0;
      border-left: var(--border) solid var(--ink);
      min-height: 40px;
      padding: 0 14px;
      background: var(--yellow);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: none;
      transition: background-color 100ms ease, color 100ms ease;
    }

    .hex-lookup button:hover {
      background: var(--ink);
      color: var(--white);
      transform: none;
    }

    .stats {
      border: var(--border) solid var(--ink);
      background: var(--white);
      display: grid;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      align-items: stretch;
      border-top: 2px solid var(--ink);
      background: transparent;
      padding: 0;
      text-align: left;
      width: 100%;
      min-height: 42px;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
      letter-spacing: normal;
      text-transform: none;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      box-shadow: none;
      transition: background-color 100ms ease;
    }

    .stat-row:first-child {
      border-top: 0;
    }

    .stat-row:hover {
      background: var(--paper);
      color: var(--ink);
      transform: none;
    }

    .stat-label {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--paper);
      border-right: 2px solid var(--ink);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .stat-value {
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .stat-copy-hint {
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity 100ms ease;
    }

    .stat-row:hover .stat-copy-hint,
    .stat-row:focus-visible .stat-copy-hint {
      opacity: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions button {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      min-height: 46px;
      border: var(--border) solid var(--ink);
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 90ms ease, box-shadow 90ms ease, background-color 100ms ease, color 100ms ease;
    }

    .actions button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .actions button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 2px;
    }

    #copyBtn {
      background: var(--red);
      color: var(--white);
    }

    #copyBtn:hover {
      background: var(--ink);
      color: var(--white);
    }

    #downloadBtn {
      background: var(--blue);
      color: var(--white);
    }

    #downloadBtn:hover {
      background: var(--yellow);
      color: var(--ink);
    }

    /* ── Plate 03: Chromatic Harmonies ─────────────────────────── */
    .harmony-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 12px;
    }

    .harmony-line {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      border: var(--border) solid var(--ink);
      background: var(--white);
    }

    .harmony-label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 10px 14px;
      background: var(--yellow);
      border-right: var(--border) solid var(--ink);
    }

    .harmony-name {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .harmony-deg {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.78;
    }

    .harmony-swatches {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
    }

    .harmony-chip {
      min-height: 60px;
      padding: 8px 10px;
      border: 0;
      border-left: var(--border) solid var(--ink);
      box-shadow: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 2px;
      text-align: left;
      transition: filter 100ms ease;
    }

    .harmony-chip:first-child {
      border-left: 0;
    }

    .harmony-chip:hover {
      transform: none;
      box-shadow: inset 0 0 0 3px var(--ink);
      filter: brightness(1.03);
    }

    .harmony-chip:active {
      transform: none;
      box-shadow: inset 0 0 0 4px var(--ink);
      filter: brightness(0.95);
    }

    .harmony-chip-hex {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .harmony-chip-role {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* ── Floating Canvas Tooltip & Toast ───────────────────────── */
    .canvas-tip {
      position: fixed;
      top: 0;
      left: 0;
      padding: 5px 8px;
      background: var(--ink);
      color: var(--white);
      border: 2px solid var(--white);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -135%);
      transition: opacity 90ms ease;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .canvas-tip.show {
      opacity: 1;
    }

    .canvas-tip-dot {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--white);
      flex: none;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      padding: 10px 16px;
      background: var(--ink);
      color: var(--white);
      border: var(--border) solid var(--ink);
      box-shadow: var(--shadow-sm);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 140ms ease, transform 160ms ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-swatch {
      width: 14px;
      height: 14px;
      border: 2px solid var(--white);
      flex: none;
    }

    /* ── Responsive Breakpoints ────────────────────────────────── */
    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }

      .wheel-body {
        min-height: clamp(400px, 68vw, 540px);
      }

      .preview {
        aspect-ratio: 21 / 8;
      }
    }

    @media (max-width: 680px) {
      .masthead {
        grid-template-columns: 1fr;
      }

      .bauhaus-mark {
        grid-template-columns: repeat(3, 24px);
        justify-content: start;
        border-right: 0;
        border-bottom: var(--border) solid var(--ink);
        padding: 12px 16px;
      }

      .masthead-meta {
        border-left: 0;
        border-top: var(--border) solid var(--ink);
        grid-template-columns: 1fr 1fr;
        grid-template-rows: none;
      }

      .meta-cell:first-child {
        border-bottom: 0;
        border-right: var(--border) solid var(--ink);
      }

      .card-header {
        flex-wrap: wrap;
      }

      .wheel-body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(320px, 1fr) auto;
        min-height: 0;
      }

      .wheel-stage {
        order: 1;
        padding: 16px;
        min-height: min(86vw, 420px);
      }

      .grayscale-rail {
        order: 2;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 10px;
        border-right: 0;
        border-top: 1px solid var(--rule);
        padding: 14px 16px 22px;
      }

      .grayscale-bar {
        flex: 1;
        max-width: 320px;
        width: auto;
        height: 20px;
        grid-template-rows: minmax(0, 1fr);
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .grayscale-bar::after {
        top: calc(100% + 5px);
        bottom: auto;
        left: 0;
        right: 0;
        width: auto;
        height: 1px;
      }

      .gray-chip::before {
        left: 50%;
        top: calc(100% + 5px);
        transform: translateX(-50%);
        width: 1px;
        height: 5px;
      }

      .gray-chip:first-child::before,
      .gray-chip:last-child::before {
        width: 1px;
        height: 7px;
      }

      .gray-chip.is-selected::before {
        left: 50%;
        top: calc(100% + 3px);
        transform: translateX(-50%);
        width: 0;
        height: 0;
        background: transparent;
        border-left: 4.5px solid transparent;
        border-right: 4.5px solid transparent;
        border-top: 0;
        border-bottom: 7px solid var(--red);
      }

      .gray-chip[data-tip]:hover::after,
      .gray-chip[data-tip]:focus-visible::after {
        left: 50%;
        top: auto;
        bottom: calc(100% + 10px);
        transform: translateX(-50%);
      }

      .harmony-line {
        grid-template-columns: 1fr;
      }

      .harmony-label {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        border-right: 0;
        border-bottom: var(--border) solid var(--ink);
      }

      .stat-row {
        grid-template-columns: 88px minmax(0, 1fr) auto;
      }

      .stat-copy-hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="bauhaus-mark" aria-hidden="true">

          <form id="hexForm" class="hex-lookup" autocomplete="off">
            <label for="hexInput" class="sr-only">Enter HEX color to find nearest wheel swatch</label>
            <input id="hexInput" type="text" maxlength="16" placeholder="#FF0000" spellcheck="false" autocorrect="off" autocapitalize="characters" enterkeyhint="go">

          <div class="stats" role="group" aria-label="Color values">

              <span class="stat-label">HSL</span>

              <span class="stat-value" id="hsbValue">0, 100%, 100%</span>
              <span class="stat-copy-hint">Copy</span>
            </button>
            <button type="button" class="stat-row" data-copy-target="toneValue">
              <span class="stat-label">TONE</span>

    <section class="card harmony-section" aria-label="Color Harmonies">
      <div class="card-header">
        <h2 class="card-title"><span class="plate-index">03</span>Harmonies</h2>
        <span id="harmonyHint" class="card-hint">Click to copy · Shift+Click to select</span>
      </div>
      <div id="harmonyGrid" class="harmony-body"></div>
    </section>
  </div>

  <div id="canvasTip" class="canvas-tip" aria-hidden="true">
    <span id="canvasTipDot" class="canvas-tip-dot"></span>
    <span id="canvasTipText"></span>
  </div>
  <div id="toast" class="toast" aria-hidden="true">
    <span id="toastSwatch" class="toast-swatch"></span>
    <span id="toastText"></span>
  </div>
  <div id="srAnnounce" class="sr-only" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const SEGMENTS = 12;
      const RINGS = 8;
      const DEFAULT_SEGMENT = 0;
      const DEFAULT_RING = 4; // Pure #FF0000
      const TAU = Math.PI * 2;
      const START_ANGLE = -Math.PI / 2;
      const SEGMENT_STEP = TAU / SEGMENTS;
      const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");

      const GRAYSCALE_VALUES = [
        "#E6E6E6", "#CCCCCC", "#B2B2B2", "#A6A6A6", "#8C8C8C",
        "#737373", "#595959", "#404040", "#262626", "#000000"
      ];

      const RING_NAMES = [
        "Tint 4", "Tint 3", "Tint 2", "Tint 1",
        "Pure Hue", "Shade 1", "Shade 2", "Shade 3"
      ];

      // 12 chromatic sectors × 8 tones (stored shade -> pure -> tint)
      const BOOK_WHEEL = [
        ["#8C0000", "#BF0000", "#D90000", "#FF0000", "#FF264D", "#FF5980", "#FF8CB2", "#FFCCE6"],
        ["#8C0E1C", "#BF1326", "#D9162B", "#FF1933", "#FF4D59", "#FF7380", "#FF99A6", "#FFCCCC"],
        ["#8C3800", "#BF4C00", "#D95700", "#FF6600", "#FF8033", "#FF9966", "#FFBF99", "#FFD9CC"],
        ["#8C5400", "#BF7300", "#D98200", "#FF9900", "#FFB233", "#FFBF66", "#FFD999", "#FFE6CC"],
        ["#8C8C00", "#BFBF00", "#D9D900", "#FFFF00", "#FFFF33", "#FFFF66", "#FFFF99", "#FFFFBF"],
        ["#388C00", "#4CBF00", "#57D900", "#66FF00", "#80FF33", "#A6FF66", "#BFFF99", "#E0FFCC"],
        ["#008C0E", "#00BF13", "#00D916", "#00FF19", "#33FF40", "#66FF73", "#8CFFA6", "#BFFFCC"],
        ["#008C54", "#00BF73", "#00D982", "#00FF99", "#33FFB2", "#66FFBF", "#8CFFCC", "#BFFFE6"],
        ["#00388C", "#004CBF", "#0057D9", "#0066FF", "#2680FF", "#5999FF", "#80BFFF", "#B2D9FF"],
        ["#000E8C", "#0013BF", "#0016D9", "#0019FF", "#2633FF", "#4059FF", "#6673FF", "#8C99FF"],
        ["#1C008C", "#2600BF", "#2B00D9", "#3300FF", "#5926FF", "#7359FF", "#9980FF", "#BFB2FF"],
        ["#54008C", "#7300BF", "#8200D9", "#9900FF", "#A633FF", "#BF66FF", "#CC99FF", "#E6CCFF"]
      ];

      const HARMONY_GROUPS = [
        { name: "Complementary", deg: "180°", offsets: [6] },
        { name: "Triadic", deg: "±120°", offsets: [4, -4] },
        { name: "Analogous", deg: "±30°", offsets: [-1, 1] }
      ];

      // ── DOM References ────────────────────────────────────────
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const wheelStage = document.getElementById("wheelStage");
      const wheelWrap = document.getElementById("wheelWrap");
      const grayscaleBarEl = document.getElementById("grayscaleBar");

      const previewEl = document.getElementById("preview");
      const previewCoordsEl = document.getElementById("previewCoords");
      const previewContrastEl = document.getElementById("previewContrast");
      const previewHexBigEl = document.getElementById("previewHexBig");

      const hexForm = document.getElementById("hexForm");
      const hexInput = document.getElementById("hexInput");
      const hexValueEl = document.getElementById("hexValue");
      const rgbValueEl = document.getElementById("rgbValue");
      const hslValueEl = document.getElementById("hslValue");
      const hsbValueEl = document.getElementById("hsbValue");
      const toneValueEl = document.getElementById("toneValue");

      const copyBtn = document.getElementById("copyBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const harmonyGridEl = document.getElementById("harmonyGrid");
      const harmonyHintEl = document.getElementById("harmonyHint");

      const canvasTip = document.getElementById("canvasTip");
      const canvasTipDot = document.getElementById("canvasTipDot");
      const canvasTipText = document.getElementById("canvasTipText");
      const toastEl = document.getElementById("toast");
      const toastSwatchEl = document.getElementById("toastSwatch");
      const toastTextEl = document.getElementById("toastText");
      const srAnnounceEl = document.getElementById("srAnnounce");

      // ── State ─────────────────────────────────────────────────
      const state = {
        mode: "wheel", // "wheel" | "grayscale"
        segment: DEFAULT_SEGMENT,
        ring: DEFAULT_RING,
        grayIndex: 0,

        harmonyPoints: [],
        hovered: null,
        hoverDisplay: null,
        hoverProgress: 0,
        pulse: 0,
        lastAnimTime: 0,
        animFrame: 0,
        resizeFrame: 0,
        urlTimer: 0,
        toastTimer: 0,
        copyBtnTimer: 0,
        isDragging: false,

        // Canvas geometry (device pixels)
        dpr: 1,
        cssSize: 0,
        size: 0,
        center: 0,
        radius: 0,
        innerRadius: 0,
        ringWidth: 0,
        tileGap: 0,
        ringRadii: [],
        wheelBuffer: document.createElement("canvas")
      };

      const grayChipEls = [];
      let lastInputWasKeyboard = false;

      // ── Color Utilities ───────────────────────────────────────
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const mod = (n, m) => ((n % m) + m) % m;

      function hexToRgb(hex) {
        if (typeof hex !== "string") return null;
        const clean = hex.trim().replace(/^#/, "");
        if (!/^[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(clean)) return null;
        const full = clean.length === 3
          ? clean[0] + clean[0] + clean[1] + clean[1] + clean[2] + clean[2]
          : clean;
        return {
          r: parseInt(full.slice(0, 2), 16),
          g: parseInt(full.slice(2, 4), 16),
          b: parseInt(full.slice(4, 6), 16)
        };
      }

      function rgbToHsl({ r, g, b }) {
        const rn = r / 255;
        const gn = g / 255;
        const bn = b / 255;
        const max = Math.max(rn, gn, bn);
        const min = Math.min(rn, gn, bn);
        const d = max - min;
        const l = (max + min) / 2;

        if (d === 0) {
          return { h: 0, s: 0, l: Math.round(l * 100) };
        }

        const s = d / (1 - Math.abs(2 * l - 1));
        let h = 0;
        if (max === rn) h = ((gn - bn) / d) % 6;
        else if (max === gn) h = (bn - rn) / d + 2;
        else h = (rn - gn) / d + 4;

        return {
          h: Math.round((h * 60 + 360) % 360),
          s: Math.round(s * 100),
          l: Math.round(l * 100)
        };
      }

      function rgbToHsb({ r, g, b }) {
        const rn = r / 255;
        const gn = g / 255;
        const bn = b / 255;
        const max = Math.max(rn, gn, bn);
        const min = Math.min(rn, gn, bn);
        const d = max - min;
        const s = max === 0 ? 0 : d / max;

        let h = 0;
        if (d !== 0) {
          if (max === rn) h = ((gn - bn) / d) % 6;
          else if (max === gn) h = (bn - rn) / d + 2;
          else h = (rn - gn) / d + 4;
        }

        return {
          h: Math.round((h * 60 + 360) % 360),
          s: Math.round(s * 100),
          b: Math.round(max * 100)
        };
      }

      function relativeLuminance({ r, g, b }) {
        const toLinear = (c) => {
          const s = c / 255;
          return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
      }

      function bestInkFor(rgb) {
        const lum = relativeLuminance(rgb);
        const darkContrast = (lum + 0.05) / (0.007 + 0.05); // against #141413
        const lightContrast = (1.0 + 0.05) / (lum + 0.05);  // against #ffffff
        if (darkContrast >= lightContrast) {
          return { ink: "#141413", ratio: darkContrast, label: darkContrast >= 7 ? "AAA" : darkContrast >= 4.5 ? "AA" : "LG" };
        }
        return { ink: "#FFFFFF", ratio: lightContrast, label: lightContrast >= 7 ? "AAA" : lightContrast >= 4.5 ? "AA" : "LG" };
      }

      // Ring 0 (inner) -> index 7 (lightest tint); Ring 7 (outer) -> index 0 (darkest shade)
      function hexForCell(segment, ring) {
        const row = BOOK_WHEEL[mod(segment, SEGMENTS)];
        return row[RINGS - 1 - clamp(ring, 0, RINGS - 1)];
      }

      function currentHex() {
        return state.mode === "grayscale"
          ? GRAYSCALE_VALUES[state.grayIndex]
          : hexForCell(state.segment, state.ring);
      }

      function currentRgb() {
        return hexToRgb(currentHex());
      }

      function sameCell(a, b) {
        return Boolean(a && b && a.segment === b.segment && a.ring === b.ring);
      }

      // ── URL Sync (supports ?s=&r=, legacy ?h=&b=, and ?gray=) ─
      function loadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const parseFiniteParam = (name) => {
          const raw = params.get(name);
          if (raw === null || raw.trim() === "") return NaN;
          return Number(raw);
        };

        const gray = params.get("gray");
        if (gray) {
          const normalized = `#${gray.replace(/^#/, "").toUpperCase()}`;
          const idx = GRAYSCALE_VALUES.indexOf(normalized);
          if (idx !== -1) {
            state.mode = "grayscale";
            state.grayIndex = idx;
            return;
          }
        }

        if (params.has("s") || params.has("r")) {
          const s = parseFiniteParam("s");
          const r = parseFiniteParam("r");
          if (Number.isFinite(s)) state.segment = mod(Math.round(s), SEGMENTS);
          if (Number.isFinite(r)) state.ring = clamp(Math.round(r), 0, RINGS - 1);
          state.mode = "wheel";
          return;
        }

        // Legacy ?h=0..360&b=0.1..1 compatibility
        if (params.has("h") || params.has("b")) {
          const h = parseFiniteParam("h");
          const b = parseFiniteParam("b");
          if (Number.isFinite(h)) {
            state.segment = mod(Math.round((h / 360) * SEGMENTS), SEGMENTS);
          }
          if (Number.isFinite(b)) {
            const norm = clamp((b - 0.1) / 0.9, 0, 1);
            state.ring = clamp(Math.round((1 - Math.pow(norm, 1 / 0.8)) * (RINGS - 1)), 0, RINGS - 1);
          }
          state.mode = "wheel";
        }
      }

      function scheduleUrlSync() {
        if (state.urlTimer) window.clearTimeout(state.urlTimer);
        state.urlTimer = window.setTimeout(() => {
          state.urlTimer = 0;
          try {
            const params = new URLSearchParams(window.location.search);
            params.delete("h");
            params.delete("b");
            if (state.mode === "grayscale") {
              params.set("gray", currentHex().slice(1));
              params.delete("s");
              params.delete("r");
            } else {
              params.set("s", String(state.segment));
              params.set("r", String(state.ring));
              params.delete("gray");
            }
            const next = `${window.location.pathname}?${params.toString()}`;
            window.history.replaceState(null, "", next);
          } catch (_err) {
            // Ignore restricted history API contexts (e.g. sandboxed iframes)
          }
        }, 120);
      }

      // ── Clipboard & Feedback ──────────────────────────────────
      function showToast(message, swatchHex) {
        toastTextEl.textContent = message;
        if (swatchHex) {
          toastSwatchEl.style.backgroundColor = swatchHex;
          toastSwatchEl.style.display = "block";
        } else {
          toastSwatchEl.style.display = "none";
        }
        toastEl.classList.add("show");
        srAnnounceEl.textContent = message;

        if (state.toastTimer) window.clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(() => {
          toastEl.classList.remove("show");
          state.toastTimer = 0;
        }, 1500);
      }

      async function copyText(text, swatchHex, updateMainBtn = false) {
        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch (_err) {
          copied = false;
        }

        if (!copied) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            copied = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (_err) {
            copied = false;
          }
        }

        if (copied) {
          showToast(`Copied ${text}`, swatchHex);
          if (updateMainBtn) {
            copyBtn.textContent = "Copied!";
            if (state.copyBtnTimer) window.clearTimeout(state.copyBtnTimer);
            state.copyBtnTimer = window.setTimeout(() => {
              copyBtn.textContent = "Copy HEX";
              state.copyBtnTimer = 0;
            }, 1000);
          }
        } else {
          showToast("Clipboard unavailable", null);
        }
        return copied;
      }

      // ── Canvas Sizing & Rendering ─────────────────────────────
      function snapHalf(v) {
        return Math.round(v * 2) / 2;
      }

      function computeCanvasSize() {
        const rect = wheelStage.getBoundingClientRect();
        const style = window.getComputedStyle(wheelStage);
        const padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
        const padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
        const cssSize = Math.floor(Math.min(rect.width - padX, rect.height - padY, 540));

        if (cssSize <= 32) return false;

        const dpr = window.devicePixelRatio || 1;
        const pixelSize = Math.max(1, Math.floor(cssSize * dpr));
        if (pixelSize === state.size && dpr === state.dpr && cssSize === state.cssSize) {
          return false;
        }

        state.dpr = dpr;
        state.cssSize = cssSize;
        state.size = pixelSize;
        state.center = pixelSize / 2;

        // Reserve outer margin for precision dial ticks, cardinal labels (incl. "270°") & rotating pointer
        const outerPad = Math.ceil(Math.max(48 * dpr, pixelSize * 0.088));
        state.radius = pixelSize / 2 - outerPad;
        state.innerRadius = snapHalf(state.radius * 0.29);
        const thickness = state.radius - state.innerRadius;
        state.ringWidth = thickness / RINGS;
        state.tileGap = Math.max(1.6 * dpr, Math.min(2.4 * dpr, state.radius * 0.011));

        state.ringRadii = Array.from({ length: RINGS + 1 }, (_, i) =>
          i === RINGS ? state.radius : snapHalf(state.innerRadius + i * state.ringWidth)
        );

        wheelWrap.style.setProperty("--wheel-size", `${cssSize}px`);
        canvas.width = pixelSize;
        canvas.height = pixelSize;
        state.wheelBuffer.width = pixelSize;
        state.wheelBuffer.height = pixelSize;
        return true;
      }

      function drawWheelBitmap() {
        const bctx = state.wheelBuffer.getContext("2d");
        const c = state.center;
        const dpr = state.dpr;
        bctx.clearRect(0, 0, state.size, state.size);

        // 1. Fill all 96 chromatic cells tightly first
        const angleOverlap = 0.004;
        for (let r = RINGS - 1; r >= 0; r -= 1) {
          const inner = state.ringRadii[r];
          const outer = state.ringRadii[r + 1] + (r < RINGS - 1 ? 0.65 * dpr : 0);

          for (let s = 0; s < SEGMENTS; s += 1) {
            const start = START_ANGLE + s * SEGMENT_STEP;
            const end = start + SEGMENT_STEP + angleOverlap;
            bctx.beginPath();
            bctx.arc(c, c, outer, start, end);
            bctx.arc(c, c, inner, end, start, true);
            bctx.closePath();
            bctx.fillStyle = hexForCell(s, r);
            bctx.fill();
          }
        }

        // 2. Carve uniform archival-paper seams between rings & sectors
        bctx.save();
        bctx.globalCompositeOperation = "destination-out";
        bctx.strokeStyle = "#000000";
        bctx.lineWidth = state.tileGap;

        for (let r = 1; r < RINGS; r += 1) {
          bctx.beginPath();
          bctx.arc(c, c, state.ringRadii[r], 0, TAU);
          bctx.stroke();
        }

        for (let s = 0; s < SEGMENTS; s += 1) {
          const angle = START_ANGLE + s * SEGMENT_STEP;
          bctx.beginPath();
          bctx.moveTo(c + Math.cos(angle) * (state.innerRadius - 1), c + Math.sin(angle) * (state.innerRadius - 1));
          bctx.lineTo(c + Math.cos(angle) * (state.radius + 1), c + Math.sin(angle) * (state.radius + 1));
          bctx.stroke();
        }
        bctx.restore();

        // 3. Precision Bauhaus outer drafting dial (36 ticks + cardinal degree labels)
        const dialR = state.radius + 6 * dpr;
        bctx.strokeStyle = "rgba(20, 20, 19, 0.22)";
        bctx.lineWidth = Math.max(1, dpr);
        bctx.beginPath();
        bctx.arc(c, c, dialR, 0, TAU);
        bctx.stroke();

        const totalTicks = 36;
        for (let i = 0; i < totalTicks; i += 1) {
          const angle = START_ANGLE + (i / totalTicks) * TAU;
          const isCardinal = i % 9 === 0;
          const isSector = i % 3 === 0;
          const tickLen = isCardinal ? 8.5 * dpr : isSector ? 5.5 * dpr : 3 * dpr;

          bctx.strokeStyle = isCardinal
            ? "rgba(20, 20, 19, 0.85)"
            : isSector
              ? "rgba(20, 20, 19, 0.48)"
              : "rgba(20, 20, 19, 0.22)";
          bctx.lineWidth = isCardinal ? Math.max(1.3, 1.5 * dpr) : Math.max(1, dpr);
          bctx.beginPath();
          bctx.moveTo(c + Math.cos(angle) * dialR, c + Math.sin(angle) * dialR);
          bctx.lineTo(c + Math.cos(angle) * (dialR + tickLen), c + Math.sin(angle) * (dialR + tickLen));
          bctx.stroke();
        }

        const labelDist = dialR + 11.5 * dpr;
        bctx.fillStyle = "#5a564e";
        bctx.font = `700 ${Math.round(9.5 * dpr)}px "SF Mono", "Menlo", monospace`;

        bctx.textAlign = "center";
        bctx.textBaseline = "bottom";
        bctx.fillText("0°", c, c - labelDist);

        bctx.textAlign = "left";
        bctx.textBaseline = "middle";
        bctx.fillText("90°", c + labelDist, c);

        bctx.textAlign = "center";
        bctx.textBaseline = "top";
        bctx.fillText("180°", c, c + labelDist);

        bctx.textAlign = "right";
        bctx.textBaseline = "middle";
        bctx.fillText("270°", c - labelDist, c);
      }

      function traceTile(cx, cy, inner, outer, start, end, radialInset = 0, arcInset = 0) {
        const rIn = Math.max(0, inner + radialInset);
        const rOut = Math.max(rIn + 1, outer - radialInset);
        const rMid = (rIn + rOut) * 0.5;
        const dAng = Math.min((end - start) * 0.42, arcInset / Math.max(1, rMid));
        ctx.beginPath();
        ctx.arc(cx, cy, rOut, start + dAng, end - dAng);
        ctx.arc(cx, cy, rIn, end - dAng, start + dAng, true);
        ctx.closePath();
      }

      function drawActiveCell(segment, ring, intensity, isSelected) {
        if (intensity <= 0.005) return;
        const inner = state.ringRadii[ring];
        const outer = state.ringRadii[ring + 1];
        const start = START_ANGLE + segment * SEGMENT_STEP;
        const end = start + SEGMENT_STEP;
        const halfGap = state.tileGap * 0.5;
        const tileInner = inner + (ring === 0 ? 0 : halfGap);
        const tileOuter = outer - (ring === RINGS - 1 ? 0 : halfGap);

        // Strictly concentric micro-expansion into the paper seam (no diagonal shift)
        const expand = halfGap * (isSelected ? 0.9 : 0.55) * Math.min(1.25, intensity);
        const hex = hexForCell(segment, ring);
        const { ink } = bestInkFor(hexToRgb(hex));

        traceTile(
          state.center,
          state.center,
          Math.max(0, tileInner - expand),
          tileOuter + expand,
          start,
          end,
          0,
          Math.max(0, halfGap - expand)
        );
        ctx.fillStyle = hex;
        ctx.fill();

        ctx.strokeStyle = "#141413";
        ctx.lineWidth = isSelected
          ? Math.max(2, state.dpr * 2.2)
          : Math.max(1.2, state.dpr * 1.5);
        ctx.stroke();

        // Subtle crisp white inner hairline on dark tiles (matches grayscale selection)
        if (isSelected && ink === "#FFFFFF") {
          traceTile(
            state.center,
            state.center,
            tileInner + state.dpr * 1.2,
            tileOuter - state.dpr * 1.2,
            start,
            end,
            0,
            halfGap + state.dpr * 1.4
          );
          ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
          ctx.lineWidth = Math.max(0.9, state.dpr);
          ctx.stroke();
        }
      }

      function drawHarmonyIndicators() {
        if (!state.harmonyPoints.length) return;
        const dpr = state.dpr;
        const halfGap = state.tileGap * 0.5;
        const frameInset = Math.min(3 * dpr, state.ringWidth * 0.22);
        const dialR = state.radius + 6 * dpr;

        for (const pt of state.harmonyPoints) {
          const inner = state.ringRadii[pt.ring] + (pt.ring === 0 ? 0 : halfGap);
          const outer = state.ringRadii[pt.ring + 1] - (pt.ring === RINGS - 1 ? 0 : halfGap);
          const start = START_ANGLE + pt.segment * SEGMENT_STEP;
          const end = start + SEGMENT_STEP;
          const { ink } = bestInkFor(hexToRgb(pt.hex));

          // Clean concentric inset contour frame following the curved tile
          traceTile(
            state.center,
            state.center,
            inner,
            outer,
            start,
            end,
            frameInset,
            halfGap + frameInset
          );
          ctx.strokeStyle = ink === "#FFFFFF" ? "rgba(255, 255, 255, 0.9)" : "rgba(20, 20, 19, 0.82)";
          ctx.lineWidth = Math.max(1.1, 1.35 * dpr);
          ctx.stroke();

          // Subtle geometric marker on outer calibration dial at harmony sector midpoint
          const midAngle = start + SEGMENT_STEP * 0.5;
          const rel = mod(pt.segment - state.segment, SEGMENTS);
          const mx = state.center + Math.cos(midAngle) * (dialR + 4.5 * dpr);
          const my = state.center + Math.sin(midAngle) * (dialR + 4.5 * dpr);

          ctx.save();
          ctx.translate(mx, my);
          ctx.rotate(midAngle + Math.PI / 2);
          if (rel === 6) {
            // Complementary: crisp solid Bauhaus square
            const s = 4.6 * dpr;
            ctx.fillStyle = "#141413";
            ctx.fillRect(-s / 2, -s / 2, s, s);
          } else if (rel === 4 || rel === 8) {
            // Triadic: crisp hollow Bauhaus square
            const s = 4.4 * dpr;
            ctx.fillStyle = "#faf8f2";
            ctx.strokeStyle = "#141413";
            ctx.lineWidth = Math.max(1.1, 1.35 * dpr);
            ctx.fillRect(-s / 2, -s / 2, s, s);
            ctx.strokeRect(-s / 2, -s / 2, s, s);
          } else {
            // Analogous: short crisp radial bar
            ctx.strokeStyle = "#141413";
            ctx.lineWidth = Math.max(1.4, 1.7 * dpr);
            ctx.beginPath();
            ctx.moveTo(0, -2.5 * dpr);
            ctx.lineTo(0, 2.5 * dpr);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawHuePointer() {
        const dpr = state.dpr;
        const angle = START_ANGLE + (state.segment + 0.5) * SEGMENT_STEP;
        const tipR = state.radius + 3 * dpr;
        const baseR = state.radius + 12.5 * dpr;
        const halfW = 4.8 * dpr;

        ctx.save();
        ctx.translate(state.center, state.center);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(tipR, 0);
        ctx.lineTo(baseR, -halfW);
        ctx.lineTo(baseR, halfW);
        ctx.closePath();
        ctx.fillStyle = "#d92b24";
        ctx.fill();
        ctx.strokeStyle = "#141413";
        ctx.lineWidth = Math.max(1.2, 1.5 * dpr);
        ctx.stroke();
        ctx.restore();
      }

      function drawCenterMedallion() {
        const c = state.center;
        const dpr = state.dpr;
        const hex = currentHex();
        const rgb = currentRgb();
        const { ink } = bestInkFor(rgb);
        const discRadius = Math.max(8, state.innerRadius - 6 * dpr);

        ctx.beginPath();
        ctx.arc(c, c, discRadius, 0, TAU);
        ctx.fillStyle = hex;
        ctx.fill();
        ctx.strokeStyle = "#141413";
        ctx.lineWidth = Math.max(1.4, 2 * dpr);
        ctx.stroke();

        if (discRadius >= 26 * dpr) {
          ctx.fillStyle = ink;
          ctx.font = `700 ${Math.round(Math.min(12 * dpr, discRadius * 0.34))}px "SF Mono", "Menlo", monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(hex, c, c);
        }
      }

      function renderCanvas() {
        if (!state.size) return;
        ctx.clearRect(0, 0, state.size, state.size);
        ctx.drawImage(state.wheelBuffer, 0, 0);

        // Hover cell (in-place crisp frame, when not the selected cell)
        if (state.hoverDisplay && state.hoverProgress > 0.01) {
          const isSelected = state.mode === "wheel" && sameCell(state.hoverDisplay, state);
          if (!isSelected) {
            drawActiveCell(state.hoverDisplay.segment, state.hoverDisplay.ring, state.hoverProgress, false);
          }
        }

        // Harmony tile frames & outer dial geometry markers
        if (state.mode === "wheel") {
          drawHarmonyIndicators();
        }

        // Selected cell (concentric in-place frame) + outer red pointer
        if (state.mode === "wheel") {
          const intensity = 1 + state.pulse * 0.3;
          drawActiveCell(state.segment, state.ring, intensity, true);
          drawHuePointer();
        }

        drawCenterMedallion();
      }

      // ── Frame-Rate-Independent Animation Loop ─────────────────
      function scheduleAnimation() {
        if (state.animFrame) return;
        state.lastAnimTime = performance.now();

        state.animFrame = window.requestAnimationFrame(function step(now) {
          state.animFrame = 0;
          const dt = Math.min(0.05, Math.max(0.001, (now - state.lastAnimTime) / 1000));
          state.lastAnimTime = now;

          const instant = REDUCED_MOTION.matches;
          let keepGoing = false;

          const hoverTarget = state.hovered ? 1 : 0;
          if (instant) {
            state.hoverProgress = hoverTarget;
          } else {
            const factor = 1 - Math.exp(-18 * dt);
            state.hoverProgress += (hoverTarget - state.hoverProgress) * factor;
            if (Math.abs(hoverTarget - state.hoverProgress) > 0.008) {
              keepGoing = true;
            } else {
              state.hoverProgress = hoverTarget;
            }
          }

          if (!state.hovered && state.hoverProgress <= 0.01) {
            state.hoverProgress = 0;
            state.hoverDisplay = null;
          }

          if (instant) {
            state.pulse = 0;
          } else if (state.pulse > 0.008) {
            state.pulse *= Math.exp(-16 * dt);
            keepGoing = true;
          } else {
            state.pulse = 0;
          }

          renderCanvas();
          if (keepGoing) scheduleAnimation();
        });
      }

      // ── UI Rendering (Minimal DOM churn) ──────────────────────
      function buildGrayscaleBarOnce() {
        const frag = document.createDocumentFragment();
        GRAYSCALE_VALUES.forEach((hex, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gray-chip";
          btn.style.backgroundColor = hex;
          btn.dataset.tip = hex;
          btn.setAttribute("aria-label", `Select grayscale ${hex}`);
          btn.setAttribute("aria-pressed", "false");
          btn.addEventListener("click", () => selectGrayscale(idx, true));
          grayChipEls.push(btn);
          frag.appendChild(btn);
        });
        grayscaleBarEl.appendChild(frag);
      }

      function syncGrayscaleBar() {
        grayChipEls.forEach((btn, idx) => {
          const active = state.mode === "grayscale" && state.grayIndex === idx;
          btn.classList.toggle("is-selected", active);
          btn.setAttribute("aria-pressed", String(active));
        });
      }

      function renderInfoPanel() {
        const hex = currentHex();
        const rgb = currentRgb();
        const hsl = rgbToHsl(rgb);
        const hsb = rgbToHsb(rgb);
        const contrast = bestInkFor(rgb);
        const isGray = state.mode === "grayscale";

        previewEl.style.backgroundColor = hex;
        previewEl.style.color = contrast.ink;
        previewHexBigEl.textContent = hex;
        previewContrastEl.textContent = `${contrast.label} ${contrast.ratio.toFixed(1)}:1`;
        previewCoordsEl.textContent = isGray
          ? `GRAY · ${String(state.grayIndex + 1).padStart(2, "0")}/10`
          : `H${String(state.segment + 1).padStart(2, "0")} · R${String(state.ring + 1).padStart(2, "0")}`;

        hexInput.value = hex;
        hexInput.placeholder = hex;

        hexValueEl.textContent = hex;
        rgbValueEl.textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
        hslValueEl.textContent = `${hsl.h}, ${hsl.s}%, ${hsl.l}%`;
        hsbValueEl.textContent = `${hsb.h}, ${hsb.s}%, ${hsb.b}%`;
        toneValueEl.textContent = isGray
          ? `Achromatic Step ${state.grayIndex + 1}/10`
          : `${RING_NAMES[state.ring]} (Ring ${state.ring + 1}/${RINGS})`;
      }

      function createHarmonyRow(title, degText, swatches) {
        const line = document.createElement("div");
        line.className = "harmony-line";

        const label = document.createElement("div");
        label.className = "harmony-label";
        const nameEl = document.createElement("span");
        nameEl.className = "harmony-name";
        nameEl.textContent = title;
        const degEl = document.createElement("span");
        degEl.className = "harmony-deg";
        degEl.textContent = degText;
        label.append(nameEl, degEl);

        const list = document.createElement("div");
        list.className = "harmony-swatches";

        for (const item of swatches) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "harmony-chip";
          btn.style.backgroundColor = item.hex;
          btn.style.color = bestInkFor(hexToRgb(item.hex)).ink;
          btn.setAttribute("aria-label", `${title} ${item.role} ${item.hex}. Click to copy, Shift+Click to select.`);

          const hexSpan = document.createElement("span");
          hexSpan.className = "harmony-chip-hex";
          hexSpan.textContent = item.hex;
          const roleSpan = document.createElement("span");
          roleSpan.className = "harmony-chip-role";
          roleSpan.textContent = item.role;
          btn.append(hexSpan, roleSpan);

          btn.addEventListener("click", (event) => {
            if (event.shiftKey && typeof item.onSelect === "function") {
              item.onSelect();
            } else {
              copyText(item.hex, item.hex, false);
            }
          });
          list.appendChild(btn);
        }

        line.append(label, list);
        return line;
      }

      function renderHarmony() {
        const frag = document.createDocumentFragment();
        state.harmonyPoints = [];

        if (state.mode === "grayscale") {
          harmonyHintEl.textContent = "Achromatic scale · Click to copy · Shift+Click to jump";
          const i = state.grayIndex;
          const stepIndices = [clamp(i - 2, 0, 9), clamp(i - 1, 0, 9), i, clamp(i + 1, 0, 9), clamp(i + 2, 0, 9)];
          const uniqueSteps = [...new Set(stepIndices)];
          const neighborSwatches = uniqueSteps.map((idx) => ({
            hex: GRAYSCALE_VALUES[idx],
            role: idx === i ? "Selected" : `Step ${idx + 1}`,
            onSelect: () => selectGrayscale(idx, true)
          }));
          frag.appendChild(createHarmonyRow("Achromatic Steps", "NEUTRAL", neighborSwatches));

          const bauhausSwatches = [
            { hex: "#D92B24", role: "Vermilion", onSelect: () => matchNearestColor("#D92B24") },
            { hex: "#F2BE1A", role: "Cadmium", onSelect: () => matchNearestColor("#F2BE1A") },
            { hex: "#1448B8", role: "Ultramarine", onSelect: () => matchNearestColor("#1448B8") }
          ];
          frag.appendChild(createHarmonyRow("Bauhaus Accents", "TRIAD", bauhausSwatches));
          harmonyGridEl.replaceChildren(frag);
          return;
        }

        harmonyHintEl.textContent = "Click to copy · Shift+Click to select";
        const baseSeg = state.segment;
        const ring = state.ring;

        for (const group of HARMONY_GROUPS) {
          const swatches = group.offsets.map((offset) => {
            const seg = mod(baseSeg + offset, SEGMENTS);
            const hex = hexForCell(seg, ring);
            state.harmonyPoints.push({ segment: seg, ring, hex });
            const deg = offset * 30;
            return {
              hex,
              role: `${deg > 0 ? "+" : ""}${deg}°`,
              onSelect: () => selectWheelCell(seg, ring, true)
            };
          });
          frag.appendChild(createHarmonyRow(group.name, group.deg, swatches));
        }

        harmonyGridEl.replaceChildren(frag);
      }

      // ── Selection Actions ─────────────────────────────────────
      function applySelection(shouldPulse, syncUrl) {
        renderHarmony();
        renderInfoPanel();
        syncGrayscaleBar();
        if (shouldPulse && state.mode === "wheel" && !REDUCED_MOTION.matches) {
          state.pulse = 1;
          scheduleAnimation();
        } else {
          renderCanvas();
        }
        if (syncUrl) {
          scheduleUrlSync();
        }
      }

      function selectWheelCell(segment, ring, withPulse) {
        const nextSeg = mod(segment, SEGMENTS);
        const nextRing = clamp(ring, 0, RINGS - 1);
        if (state.mode === "wheel" && state.segment === nextSeg && state.ring === nextRing) {
          hexInput.value = currentHex();
          return;
        }
        state.mode = "wheel";
        state.segment = nextSeg;
        state.ring = nextRing;
        applySelection(withPulse, true);
      }

      function selectGrayscale(index, syncUrl = true) {
        const nextIdx = clamp(index, 0, GRAYSCALE_VALUES.length - 1);
        if (state.mode === "grayscale" && state.grayIndex === nextIdx) {
          hexInput.value = currentHex();
          return;
        }
        state.mode = "grayscale";
        state.grayIndex = nextIdx;
        applySelection(false, syncUrl);
      }

      function matchNearestColor(rawHex) {
        const target = hexToRgb(rawHex);
        if (!target) {
          showToast("Enter valid HEX (e.g. #FF6600)", null);
          return;
        }

        let best = { mode: "wheel", segment: 0, ring: 4, dist: Infinity };
        const distSq = (a, b) => (a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2;

        for (let s = 0; s < SEGMENTS; s += 1) {
          for (let r = 0; r < RINGS; r += 1) {
            const rgb = hexToRgb(hexForCell(s, r));
            const d = distSq(target, rgb);
            if (d < best.dist) {
              best = { mode: "wheel", segment: s, ring: r, dist: d };
            }
          }
        }

        GRAYSCALE_VALUES.forEach((hex, idx) => {
          const d = distSq(target, hexToRgb(hex));
          if (d < best.dist) {
            best = { mode: "grayscale", grayIndex: idx, dist: d };
          }
        });

        if (best.mode === "grayscale") {
          selectGrayscale(best.grayIndex, true);
        } else {
          selectWheelCell(best.segment, best.ring, true);
        }
        hexInput.value = currentHex();
        hexInput.blur();
        showToast(`Matched ${currentHex()}`, currentHex());
      }

      // ── Canvas Hit-Testing & Pointer Events ───────────────────
      function pickCell(clientX, clientY) {
        if (!state.size) return null;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return null;

        const scale = canvas.width / rect.width;
        const dx = (clientX - rect.left) * scale - state.center;
        const dy = (clientY - rect.top) * scale - state.center;
        const dist = Math.hypot(dx, dy);

        if (dist < state.innerRadius || dist >= state.radius) {
          return null;
        }

        let ring = -1;
        for (let i = 0; i < RINGS; i += 1) {
          if (dist >= state.ringRadii[i] && dist < state.ringRadii[i + 1]) {
            ring = i;
            break;
          }
        }
        if (ring === -1) return null;

        const angle = mod(Math.atan2(dy, dx) - START_ANGLE, TAU);
        const segment = clamp(Math.floor(angle / SEGMENT_STEP), 0, SEGMENTS - 1);
        return { segment, ring };
      }

      function setHovered(cell) {
        if (sameCell(cell, state.hovered)) return;
        state.hovered = cell;
        if (cell) {
          state.hoverDisplay = { segment: cell.segment, ring: cell.ring };
          if (state.hoverProgress > 0.25) state.hoverProgress = 0.25;
        }
        scheduleAnimation();
      }

      function showCanvasTip(hex, x, y) {
        const flipBelow = y < 44;
        canvasTipDot.style.backgroundColor = hex;
        canvasTipText.textContent = hex;
        canvasTip.style.left = `${x}px`;
        canvasTip.style.top = `${flipBelow ? y + 10 : y - 8}px`;
        canvasTip.style.transform = flipBelow ? "translate(-50%, 25%)" : "translate(-50%, -135%)";
        canvasTip.classList.add("show");
      }

      function hideCanvasTip() {
        canvasTip.classList.remove("show");
      }

      function onPointerDown(event) {
        if (event.button !== 0 && event.pointerType === "mouse") return;
        const picked = pickCell(event.clientX, event.clientY);
        if (!picked) return;

        state.isDragging = true;
        lastInputWasKeyboard = false;
        canvas.classList.remove("is-keyboard-focus");
        try {
          canvas.setPointerCapture(event.pointerId);
        } catch (_err) {
          // Ignore unsupported pointer capture
        }
        canvas.focus({ preventScroll: true });
        selectWheelCell(picked.segment, picked.ring, true);
      }

      function onPointerMove(event) {
        const picked = pickCell(event.clientX, event.clientY);
        if (!picked) {
          canvas.style.cursor = "default";
          setHovered(null);
          hideCanvasTip();
          return;
        }

        canvas.style.cursor = "crosshair";
        setHovered(picked);
        const hex = hexForCell(picked.segment, picked.ring);
        showCanvasTip(hex, event.clientX, event.clientY);

        if (state.isDragging) {
          selectWheelCell(picked.segment, picked.ring, false);
        }
      }

      function onPointerUp(event) {
        if (state.isDragging) {
          state.isDragging = false;
          try {
            if (canvas.hasPointerCapture(event.pointerId)) {
              canvas.releasePointerCapture(event.pointerId);
            }
          } catch (_err) {
            // Ignore
          }
        }
        if (event.pointerType !== "mouse") {
          clearHover();
        }
      }

      function clearHover() {
        canvas.style.cursor = "default";
        setHovered(null);
        hideCanvasTip();
      }

      // Scoped keyboard navigation when #wheel is focused
      function onWheelKeyDown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;

        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          copyText(currentHex(), currentHex(), true);
          return;
        }

        let seg = state.segment;
        let ring = state.ring;

        switch (event.key) {
          case "ArrowRight":
            seg = mod(seg + 1, SEGMENTS);
            break;
          case "ArrowLeft":
            seg = mod(seg - 1, SEGMENTS);
            break;
          case "ArrowUp":
            ring = clamp(ring - 1, 0, RINGS - 1);
            break;
          case "ArrowDown":
            ring = clamp(ring + 1, 0, RINGS - 1);
            break;
          default:
            return;
        }

        event.preventDefault();
        selectWheelCell(seg, ring, true);
        srAnnounceEl.textContent = `Selected ${currentHex()}, ${RING_NAMES[state.ring]}`;
      }

      // ── Export PNG ────────────────────────────────────────────
      function downloadPng() {
        const hex = currentHex();
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = 1024;
        exportCanvas.height = 1024;
        const ectx = exportCanvas.getContext("2d");
        ectx.fillStyle = hex;
        ectx.fillRect(0, 0, 1024, 1024);

        const filename = `color-${hex.slice(1)}.png`;
        const triggerDownload = (href, revoke) => {
          const link = document.createElement("a");
          link.download = filename;
          link.href = href;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          if (revoke) {
            window.setTimeout(() => URL.revokeObjectURL(href), 1000);
          }
          showToast(`Exported ${filename}`, hex);
        };

        if (exportCanvas.toBlob) {
          exportCanvas.toBlob((blob) => {
            if (!blob) return;
            triggerDownload(URL.createObjectURL(blob), true);
          }, "image/png");
        } else {
          triggerDownload(exportCanvas.toDataURL("image/png"), false);
        }
      }

      // ── Resize Handling ───────────────────────────────────────
      function redrawIfResized() {
        if (!computeCanvasSize()) return;
        drawWheelBitmap();
        renderCanvas();
      }

      function scheduleResize() {
        if (state.resizeFrame) window.cancelAnimationFrame(state.resizeFrame);
        state.resizeFrame = window.requestAnimationFrame(() => {
          state.resizeFrame = 0;
          redrawIfResized();
        });
      }

      // ── Bootstrap ─────────────────────────────────────────────
      function init() {
        loadFromUrl();
        buildGrayscaleBarOnce();
        redrawIfResized();
        applySelection(false, false);

        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerUp);
        canvas.addEventListener("pointerleave", clearHover);
        canvas.addEventListener("keydown", onWheelKeyDown);
        canvas.addEventListener("focus", () => {
          canvas.classList.toggle("is-keyboard-focus", lastInputWasKeyboard);
        });
        canvas.addEventListener("blur", () => {
          canvas.classList.remove("is-keyboard-focus");
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Tab") lastInputWasKeyboard = true;
        }, true);
        window.addEventListener("pointerdown", () => {
          lastInputWasKeyboard = false;
        }, true);

        copyBtn.addEventListener("click", () => copyText(currentHex(), currentHex(), true));
        downloadBtn.addEventListener("click", downloadPng);

        hexForm.addEventListener("submit", (event) => {
          event.preventDefault();
          matchNearestColor(hexInput.value);
        });
        hexInput.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            hexInput.value = currentHex();
            hexInput.blur();
          }
        });

        document.querySelectorAll(".stat-row[data-copy-target]").forEach((row) => {
          row.addEventListener("click", () => {
            const target = document.getElementById(row.dataset.copyTarget);
            if (target) copyText(target.textContent, currentHex(), false);
          });
        });

        if (typeof ResizeObserver === "function") {
          const ro = new ResizeObserver(scheduleResize);
          ro.observe(wheelStage);
        }
        window.addEventListener("resize", scheduleResize);
      }

      init();
    })();
  </script>
</body>
</html>
